<svg xmlns="http://www.w3.org/2000/svg" width="468" height="229" viewBox="0 0 468 229" role="img" aria-label="Home Credit Default Risk project card"><title>Home Credit Default Risk project card</title><rect x="1" y="1" width="466" height="227" rx="14" fill="#161b22" stroke="#30363d"/><text x="22" y="36" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="start" >Home Credit Default Risk</text><rect x="0" y="14" width="4" height="26" rx="2" fill="#39d353"/><rect x="22" y="50" width="69" height="22" rx="11" fill="#39d353" fill-opacity="0.15" stroke="#39d353" stroke-opacity="0.5"/><text x="56.519999999999996" y="65" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#39d353" text-anchor="middle" >LightGBM</text><rect x="99.03999999999999" y="50" width="63" height="22" rx="11" fill="#39d353" fill-opacity="0.15" stroke="#39d353" stroke-opacity="0.5"/><text x="130.37" y="65" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#39d353" text-anchor="middle" >XGBoost</text><rect x="169.7" y="50" width="69" height="22" rx="11" fill="#39d353" fill-opacity="0.15" stroke="#39d353" stroke-opacity="0.5"/><text x="204.21999999999997" y="65" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#39d353" text-anchor="middle" >CatBoost</text><rect x="246.73999999999998" y="50" width="56" height="22" rx="11" fill="#39d353" fill-opacity="0.15" stroke="#39d353" stroke-opacity="0.5"/><text x="274.88" y="65" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#39d353" text-anchor="middle" >pytest</text><rect x="311.02" y="50" width="31" height="22" rx="11" fill="#39d353" fill-opacity="0.15" stroke="#39d353" stroke-opacity="0.5"/><text x="326.4" y="65" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#39d353" text-anchor="middle" >CI</text><text x="22" y="92" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#8b949e" text-anchor="start" >Installable pipeline for a course competition: 46 engineered</text><text x="22" y="109" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#8b949e" text-anchor="start" >features, 35 logged experiments, blended boosting models, leakage</text><text x="22" y="126" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#8b949e" text-anchor="start" >tests and submission validation.</text><line x1="22" x2="446" y1="147" y2="147" stroke="#30363d"/><text x="22" y="167" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#e3b341" text-anchor="start" letter-spacing="1">STATUS</text><text x="22" y="185" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#c9d1d9" text-anchor="start" >5-fold CV AUC 0.670 baseline to 0.762 blend, slightly optimistic.</text><text x="22" y="202" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#c9d1d9" text-anchor="start" >Data not included. Educational, not a lending system.</text></svg>